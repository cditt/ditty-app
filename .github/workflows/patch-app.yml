name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collapse workout days
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old1 = "var bodyOpen=(isToday||isAlreadyOpen)?' open':'';"
          new1 = "var bodyOpen=isAlreadyOpen?' open':'';"
          if old1 not in t:
              if new1 in t:
                  print('bodyOpen already collapsed')
              else:
                  raise SystemExit('bodyOpen missing')
          else:
              t = t.replace(old1, new1, 1)
              print('bodyOpen fixed')

          old2 = "  for(var j=0;j<dayBodies.length;j++)dayBodies[j].classList.remove('open');\n  var target=dayBodies[todayIdx];\n  if(target){\n    target.classList.add('open');"
          new2 = "  for(var j=0;j<dayBodies.length;j++)dayBodies[j].classList.remove('open');\n  var target=dayBodies[todayIdx];\n  if(false && target){\n    target.classList.add('open');"
          if old2 not in t:
              if 'if(false && target)' in t:
                  print('force-open already disabled')
              else:
                  raise SystemExit('force-open block missing')
          else:
              t = t.replace(old2, new2, 1)
              print('force-open disabled')

          p.write_text(t)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v18','ditty-v19'),('ditty-v17','ditty-v19'),('ditty-v16','ditty-v19')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Start workout day cards collapsed; tap header to open"
          git push
