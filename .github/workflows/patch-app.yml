name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Green card when sets are done
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = """    var wasCompleted=false;\n    if(!day.rest&&S.workoutHistory){\n      for(var h=0;h<S.workoutHistory.length;h++){\n        var sess=S.workoutHistory[h];\n        if(sess.date===dayStr&&sess.type===day.type){wasCompleted=true;break;}\n      }\n    }"""
          new = """    var wasCompleted=false;\n    if(!day.rest){\n      if(S.workoutHistory){\n        var todayStr=new Date().toLocaleDateString();\n        for(var h=0;h<S.workoutHistory.length;h++){\n          var sess=S.workoutHistory[h];\n          if(sess.type!==day.type)continue;\n          if(sess.date===dayStr||(isToday&&sess.date===todayStr)){wasCompleted=true;break;}\n        }\n      }\n      if(!wasCompleted){\n        var allSetsDone=true,anySet=false;\n        for(var e0=0;e0<day.exercises.length;e0++){\n          var ex0=day.exercises[e0];\n          for(var s0=0;s0<ex0.sets;s0++){\n            anySet=true;\n            var k0=prog+'-'+d+'-'+e0+'-'+s0;\n            if(!(workoutSets[k0]&&workoutSets[k0].done))allSetsDone=false;\n          }\n        }\n        if(anySet&&allSetsDone)wasCompleted=true;\n      }\n    }"""
          if old not in t:
              raise SystemExit('wasCompleted block missing')
          t = t.replace(old, new, 1)
          sw = Path('sw.js')
          swt = sw.read_text()
          for a,b in [('ditty-v8','ditty-v9'),('ditty-v7','ditty-v9'),('ditty-v6','ditty-v9')]:
              if a in swt:
                  swt = swt.replace(a,b); break
          sw.write_text(swt)
          p.write_text(t)
          print('patched ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Green the day card when all sets are done"
          git push
