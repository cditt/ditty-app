name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Color nav icons
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = ".nav-btn.active{color:#e02020;}"
          new = (
              ".nav-btn[data-tab=\"home\"]{color:#f3d58a;}"
              ".nav-btn[data-tab=\"log\"]{color:#e24a3a;}"
              ".nav-btn[data-tab=\"water\"]{color:#4aa8e8;}"
              ".nav-btn[data-tab=\"weight\"]{color:#e0b84a;}"
              ".nav-btn[data-tab=\"workouts\"]{color:#e06a28;}"
              ".nav-btn[data-tab=\"pills\"]{color:#c56ad6;}"
              ".nav-btn.active{background:rgba(255,255,255,0.08);}"
              ".nav-btn.active .nav-icon{filter:drop-shadow(0 0 5px currentColor);transform:scale(1.08);}"
              ".nav-btn.active .nav-label{color:#fff6d8;}"
          )
          if old not in t:
              if '.nav-btn[data-tab="home"]' in t:
                  print('colors already present')
              else:
                  raise SystemExit('active css missing')
          else:
              t = t.replace(old, new, 1)
              print('colors added')
          p.write_text(t)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v16','ditty-v17'),('ditty-v15','ditty-v17'),('ditty-v14','ditty-v17')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          print('cache ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Colorize bottom nav icons by tab"
          git push
