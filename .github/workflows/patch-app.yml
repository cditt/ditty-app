name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change rest to 45 seconds
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          if 'var REST_DURATION=90;' not in t:
              raise SystemExit('REST_DURATION missing')
          t = t.replace('var REST_DURATION=90;// seconds — standard rest between sets', 'var REST_DURATION=45;// seconds — rest between sets', 1)
          t = t.replace("notes:'90 sec rest on compounds, 60 sec on accessories.'", "notes:'45 sec rest on compounds, 60 sec on accessories.'", 1)
          p.write_text(t)
          sw = Path('sw.js')
          swt = sw.read_text()
          for a,b in [('ditty-v10','ditty-v11'),('ditty-v9','ditty-v11'),('ditty-v8','ditty-v11')]:
              if a in swt:
                  swt = swt.replace(a,b); break
          sw.write_text(swt)
          print('patched ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Change rest timer from 90s to 45s"
          git push
