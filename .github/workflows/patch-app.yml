name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefill suggested weight in inputs
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = """            if(suggested){\n              html+='<div style="font-family:\\'Courier Prime\\',monospace;font-size:9px;color:#1a3a6a;margin-bottom:2px;cursor:pointer;" onclick="document.getElementById(\\'w-'+key+'\\').value='+suggested+';setSetWeight(\\''+key+'\\',\\''+prog+'\\','+d+','+suggested+')">&#8593; Try '+suggested+'lb (+2.5 from last)</div>';\n            }\n            html+='<input type="number" id="w-'+key+'" value="'+curWeight+'" placeholder="'+(lastWeight?lastWeight+' last':' lbs')+'"""
          new = """            var showWeight=curWeight||suggested||'';\n            if(suggested){\n              html+='<div style="font-family:\\'Courier Prime\\',monospace;font-size:9px;color:#1a3a6a;margin-bottom:2px;">sug '+suggested+' \u00b7 last '+lastWeight+'</div>';\n            }\n            html+='<input type="number" id="w-'+key+'" value="'+showWeight+'" placeholder="'+(lastWeight?('last '+lastWeight):'lbs')+'"""
          if old not in t:
              raise SystemExit('weight input pattern missing')
          t = t.replace(old, new, 1)
          sw = Path('sw.js')
          swt = sw.read_text().replace("ditty-v6", "ditty-v7")
          sw.write_text(swt)
          p.write_text(t)
          print('patched ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Prefill suggested weight in the set input box"
          git push
