name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Word + Gym card
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          start = t.find('      <!-- WORD + GYM LEAVE -->')
          end = t.find('      <!-- MOTIVATION CARD -->')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('card markers missing start=%s end=%s' % (start, end))
          t = t[:start] + t[end:]
          t = t.replace('  S.wordDone=false;S.gymLeft=false;\n', '')
          t = t.replace('  renderWordGym();\n', '')
          fn_start = t.find('function toggleWordDone()')
          fn_end = t.find('function render(){')
          if fn_start >= 0 and fn_end > fn_start:
              t = t[:fn_start] + t[fn_end:]
          if 'word-gym-card' in t or 'toggleWordDone' in t:
              raise SystemExit('removal incomplete')
          p.write_text(t)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v13','ditty-v14'),('ditty-v12','ditty-v14'),('ditty-v11','ditty-v14')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          print('removed ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Remove unsolicited Word + Work Gym card"
          git push
