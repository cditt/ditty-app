name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nav icons
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old_css = ".nav-icon{font-size:13px;line-height:1;}"
          new_css = ".nav-icon{font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;width:20px;height:20px;}.nav-icon svg{display:block;width:20px;height:20px;}"
          if old_css not in t:
              raise SystemExit('nav-icon css missing')
          if 'nav-icon svg' not in t:
              t = t.replace(old_css, new_css, 1)

          def ico(svg):
              return '<span class="nav-icon">' + svg + '</span>'

          house = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6.5 10.5V20h11V10.5"/><path d="M10 20v-6h4v6"/></svg>'
          fork = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16"/><path d="M6 8h4"/><path d="M16.5 5l2 3-4.5 12"/><path d="M15.2 12.5h5"/></svg>'
          drop = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7.2 6 11.2A6 6 0 1 1 6 14.2C6 10.2 12 3 12 3z"/></svg>'
          scale = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><circle cx="12" cy="15" r="2.2"/><path d="M12 13v-1.5"/></svg>'
          dumb = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9v6"/><path d="M17 9v6"/><path d="M5 10v4"/><path d="M19 10v4"/><path d="M7 12h10"/><rect x="2.5" y="8.5" width="2.2" height="7" rx="0.6"/><rect x="19.3" y="8.5" width="2.2" height="7" rx="0.6"/></svg>'
          pill = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.2" y="3.2" width="7.6" height="17.6" rx="3.8" transform="rotate(45 12 12)"/><path d="M8.2 15.8l7.6-7.6"/></svg>'

          pairs = [
              ('<span class="nav-icon">&#127968;</span><span class="nav-label">Home</span>', ico(house) + '<span class="nav-label">Home</span>'),
              ('<span class="nav-icon">&#128172;</span><span class="nav-label">Log</span>', ico(fork) + '<span class="nav-label">Food</span>'),
              ('<span class="nav-icon">&#128167;</span><span class="nav-label">Water</span>', ico(drop) + '<span class="nav-label">Water</span>'),
              ('<span class="nav-icon">&#9878;&#65039;</span><span class="nav-label">Weight</span>', ico(scale) + '<span class="nav-label">Weight</span>'),
              ('<span class="nav-icon">&#x1F94A;</span><span class="nav-label">Gym</span>', ico(dumb) + '<span class="nav-label">Gym</span>'),
              ('<span class="nav-icon">&#128138;</span><span class="nav-label">Pills</span>', ico(pill) + '<span class="nav-label">Pills</span>'),
          ]
          for a,b in pairs:
              if a not in t:
                  if b in t:
                      print('already', a[-20:])
                      continue
                  raise SystemExit('missing ' + a)
              t = t.replace(a, b, 1)
              print('replaced', a[-24:])

          p.write_text(t)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v14','ditty-v15'),('ditty-v13','ditty-v15'),('ditty-v12','ditty-v15')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          print('done')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Replace generic tab emojis with food/gym/scale icons"
          git push
