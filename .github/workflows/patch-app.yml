name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rest 45s
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          n1 = t.count('var REST_DURATION=90;')
          t = t.replace('var REST_DURATION=90;', 'var REST_DURATION=45;')
          t = t.replace('90 sec rest on compounds', '45 sec rest on compounds')
          if 'var REST_DURATION=45;' not in t:
              raise SystemExit('duration not updated')
          p.write_text(t)
          print('replaced', n1)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v11','ditty-v12'),('ditty-v10','ditty-v12'),('ditty-v9','ditty-v12')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Set rest timer to 45 seconds"
          git push
