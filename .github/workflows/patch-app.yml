name: patch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop auto open workout
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = "    if(!body)return;\n    body.classList.add('open');"
          new = "    if(!body)return;\n    /* stay collapsed until tap */"
          if old not in t:
              if 'stay collapsed until tap' in t:
                  print('openToday already patched')
              else:
                  raise SystemExit('openToday add-open missing')
          else:
              t = t.replace(old, new, 1)
              print('openToday patched')
          old2 = "if(name==='workouts')setTimeout(openToday,350);"
          new2 = "if(name==='workouts')setTimeout(function(){injectRuleStrips();wireSetBtns();},350);"
          if old2 in t:
              t = t.replace(old2, new2, 1)
              print('hook patched')
          else:
              print('hook already gone or different')
          p.write_text(t)
          sw = Path('sw.js').read_text()
          for a,b in [('ditty-v20','ditty-v21'),('ditty-v19','ditty-v21'),('ditty-v18','ditty-v21')]:
              if a in sw:
                  sw = sw.replace(a,b); break
          Path('sw.js').write_text(sw)
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "cditt"
          git config user.email "43458916+cditt@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "Do not auto-expand today's workout; tap to open"
          git push
